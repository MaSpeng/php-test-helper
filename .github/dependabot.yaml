version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore(github-actions)

  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore(devcontainers)

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: chore(composer)
